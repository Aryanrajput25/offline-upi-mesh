# Starts a MySQL 8.4 database for the "mysql" Spring profile.
#   docker compose up -d      -> start it
#   docker compose down       -> stop it (data is kept in the named volume)
#   docker compose down -v    -> stop it AND delete the data
#
# The credentials below match the defaults in application-mysql.properties.
# If port 3306 is already taken on your machine, run with MYSQL_PORT=3307 (and start the app with the same variable).
services:
  mysql:
    image: mysql:8.4
    container_name: upimesh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: upimesh
      MYSQL_USER: upimesh
      MYSQL_PASSWORD: upimesh
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - upimesh-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  upimesh-mysql-data:
