# MySQL profile - only active when started with the "mysql" Spring profile:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#
# Anything set here overrides application.properties (the H2 defaults).
# Every connection detail can be changed with an environment variable, the value
# after the colon is the default. These defaults match the docker-compose.yml in the project root.

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:upimesh}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:upimesh}
spring.datasource.password=${MYSQL_PASSWORD:upimesh}

# Must be overridden here, application.properties hardcodes the H2 dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# update = keep tables and data between restarts (that is the point of using MySQL).
# Use DDL_AUTO=create to wipe and rebuild the schema on every start (handy for running the tests,
# because the concurrency test debits alice@demo and a persistent DB would slowly drain her balance).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Store Instant timestamps (signedAt / settledAt) as UTC, no matter what timezone the machine is in
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# The H2 console makes no sense with MySQL (use MySQL Workbench or the mysql CLI)
spring.h2.console.enabled=false
